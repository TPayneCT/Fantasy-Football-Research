name: Update fantasy data

on:
  schedule:
    - cron: "0 12 * * 2"   # Tuesday 12:00 UTC, after Monday Night Football
    - cron: "0 12 * * 4"   # Thursday 12:00 UTC, before Thursday Night Football (roster moves, stat corrections)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data
        run: python scripts/update.py
      - name: Check scoring still matches the league
        run: python scripts/validate_scoring.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data dashboard/data.js
          git diff --cached --quiet || git commit -m "Update fantasy data $(date -u +%Y-%m-%d)"
          git push
