name: Update fantasy data

on:
  schedule:
    # GitHub cron is UTC only. Arizona is UTC-7 all year (no daylight saving).
    - cron: "5 5 * * 2"    # Tue 05:05 UTC = Mon 10:05pm Arizona: right after Monday Night Football
    - cron: "35 6 * * 2"   # Tue 06:35 UTC = Mon 11:35pm Arizona: backup for overtime, late MNF or a delayed run
    - cron: "0 12 * * *"   # Daily 12:00 UTC (5am Arizona): stat corrections and roster moves
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data
        run: python scripts/update.py
      - name: Check scoring still matches the league
        run: python scripts/validate_scoring.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data dashboard/data.js dashboard/stats
          git diff --cached --quiet || git commit -m "Update fantasy data $(date -u +%Y-%m-%d)"
          git push
