<title>Points Allowed Board</title>
<meta name="description" content="Fantasy points allowed by each NFL defense to each position, scored with The Undrafted Benchwarmers league settings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one column. Header + controls, then the team x position board, then the drilldown for the tapped cell. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --surface-2: #e8ece7;
  --line: #d3d9d2;
  --fg: #18201a;
  --muted: #5d685f;
  --accent: #23508f;
  --good: #1f8a4c;
  --bad: #c2412d;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --surface: #1a211c; --surface-2: #232c25; --line: #313b33;
    --fg: #e6ebe5; --muted: #98a59a; --accent: #7fa8e8; --good: #3fbf72; --bad: #ef6a52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --surface: #1a211c; --surface-2: #232c25; --line: #313b33;
  --fg: #e6ebe5; --muted: #98a59a; --accent: #7fa8e8; --good: #3fbf72; --bad: #ef6a52;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-size: 14px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 6vw, 42px); line-height: 1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 62ch; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.field { display: grid; gap: 3px; }
.field > span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
select, input[type="search"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 36px; }
input[type="search"] { width: 13em; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; background: var(--bg); color: var(--fg); border: 0; padding: 6px 10px; min-height: 36px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
button:focus-visible, select:focus-visible, input:focus-visible, td.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .03em; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); padding: 8px 12px 6px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.view { display: grid; gap: 18px; }
.matchup th[scope="row"] .opp-of { display: block; font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); }
.team { display: grid; gap: 8px; }
.team h2 { font-family: var(--font-display); font-size: 26px; margin: 0; }
.pl { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.pl.bench { background: transparent; }
.pl .pos { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--accent); }
.pl .who { min-width: 0; }
.pl .who b { font-size: 16px; }
.pl .who small { display: block; color: var(--muted); font-size: 13px; }
.pl .rate { text-align: right; font-variant-numeric: tabular-nums; }
.pl .rate b { display: block; font-family: var(--font-display); font-size: 22px; line-height: 1; }
.pl .rate small { color: var(--muted); font-size: 12px; }
.pl.tap { cursor: pointer; }
.group-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-top: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 13px; color: var(--muted); }
.ramp { display: inline-flex; align-items: center; gap: 6px; }
.ramp i { display: inline-block; width: 88px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--bad), var(--surface-2), var(--good)); }

.board { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 0; text-align: center; }
thead th { position: sticky; top: 0; background: var(--surface); z-index: 1; border-bottom: 1px solid var(--line); }
thead button { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: .04em; color: var(--fg); background: none; border: 0; padding: 10px 4px 8px; width: 100%; cursor: pointer; }
thead button .arrow { color: var(--accent); font-size: 12px; margin-left: 2px; }
thead .avg { display: block; font-family: var(--font-body); font-weight: 400; font-size: 11px; color: var(--muted); letter-spacing: 0; }
tbody th { text-align: left; font-family: var(--font-display); font-weight: 600; font-size: 17px; padding: 0 10px; white-space: nowrap; border-bottom: 1px solid var(--line); }
td.cell { cursor: pointer; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); padding: 7px 4px; min-width: 56px; }
td.cell .v { display: block; font-weight: 700; font-size: 16px; }
td.cell .r { display: block; font-size: 11px; color: var(--muted); }
td.cell[aria-selected="true"] { outline: 2px solid var(--accent); outline-offset: -2px; }
tbody tr:hover th { color: var(--accent); }
.empty { padding: 24px; color: var(--muted); text-align: center; }

.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; scroll-margin-top: 12px; }
.detail h2 { font-family: var(--font-display); font-size: 26px; margin: 0; line-height: 1.1; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; vertical-align: middle; }
.pill.good { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pill.mid { background: var(--surface-2); color: var(--muted); }
.weeks { display: grid; gap: 8px; }
.wk { display: grid; grid-template-columns: 6.6em minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; border-top: 1px solid var(--line); padding-top: 10px; }
.wk .side { display: grid; gap: 3px; }
.wk .lbl { font-family: var(--font-display); font-weight: 600; color: var(--muted); }
.wk .opp { font-weight: 700; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.logo { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none; width: 22px; height: 22px; border-radius: 50%; font: 700 7.5px/1 var(--font-body); letter-spacing: 0; overflow: hidden; vertical-align: middle; }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.tm { display: inline-flex; align-items: center; gap: 5px; }
tbody th, thead th:first-child { position: sticky; left: 0; z-index: 2; background: var(--surface); }
th.all, td.cell[data-pos="ALL"] { border-left: 2px solid var(--fg); }
.wk .lbl { display: flex; align-items: center; gap: 6px; }
.wk .tot { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.wk .tot { grid-column: 3; grid-row: 1; }
.wk ul { grid-column: 2; grid-row: 1; list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; min-width: 0; }
.wk li b { font-variant-numeric: tabular-nums; }
.wk li.zero { color: var(--muted); }
.d { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
.d.up { color: var(--good); }
.d.down { color: var(--bad); }
.wk .note { font-size: 12px; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
footer { color: var(--muted); font-size: 12px; }
@media (max-width: 520px) {
  tbody th { padding: 0 4px; font-size: 14px; }
  .tm { gap: 3px; }
  th .logo { width: 16px; height: 16px; }
  td.cell { min-width: 41px; padding: 6px 1px; }
  td.cell .v { font-size: 14px; }
  td.cell .r { font-size: 10px; }
  thead button { font-size: 14px; padding-inline: 1px; }
  thead .avg { font-size: 9.5px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">The Undrafted Benchwarmers scoring</div>
    <h1>Points Allowed Board</h1>
    <p class="sub">Fantasy points each NFL defense gave up to each position. Higher numbers and green cells mean an easier matchup. Tap any number to see the week-by-week players behind it.</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Views">
    <button type="button" data-view="board">Points allowed</button>
    <button type="button" data-view="week">Matchups</button>
    <button type="button" data-view="team">My team</button>
  </nav>

  <section class="controls" aria-label="Filters">
    <label class="field"><span>Season</span><select id="season"></select></label>
    <label class="field"><span>From week</span><select id="from"></select></label>
    <label class="field"><span>To week</span><select id="to"></select></label>
    <div class="field"><span>Quick range</span>
      <div class="seg" id="quick">
        <button type="button" data-n="3">Last 3</button>
        <button type="button" data-n="5">Last 5</button>
        <button type="button" data-n="0">All</button>
      </div>
    </div>
    <div class="field"><span>Show</span>
      <div class="seg" id="mode">
        <button type="button" data-mode="avg">Per game</button>
        <button type="button" data-mode="total">Total</button>
      </div>
    </div>
    <div class="field"><span>Points</span>
      <div class="seg" id="adj">
        <button type="button" data-adj="0">Raw</button>
        <button type="button" data-adj="1">Schedule-adjusted</button>
      </div>
    </div>
    <label class="field" id="mweek-field"><span>Matchup week</span><select id="mweek"></select></label>
    <label class="field"><span>Team</span><input type="search" id="search" placeholder="e.g. DAL, Dallas, Cowboys" autocomplete="off"></label>
  </section>

  <div class="legend">
    <span class="ramp">Tough <i></i> Easy</span>
    <span id="legend-note"></span>
  </div>

  <div id="view-board" class="view">
    <div class="board"><table id="board" aria-label="Points allowed by defense and position"></table></div>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>

  <div id="view-week" class="view" hidden>
    <div class="board"><table id="week" aria-label="Upcoming matchups by offense and position"></table></div>
    <p class="hint" id="byes"></p>
  </div>

  <div id="view-team" class="view" hidden>
    <section class="team" id="team"></section>
  </div>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>
<script>
(() => {
  const POS = ["QB", "RB", "WR", "TE", "K", "DEF"];
  const OFF = ["QB", "RB", "WR", "TE", "K"];    // the ALL column: points allowed to offense, DEF left out
  const COLS = [...POS, "ALL"];
  const TEAMS = {
    ARI: "Arizona Cardinals", ATL: "Atlanta Falcons", BAL: "Baltimore Ravens", BUF: "Buffalo Bills",
    CAR: "Carolina Panthers", CHI: "Chicago Bears", CIN: "Cincinnati Bengals", CLE: "Cleveland Browns",
    DAL: "Dallas Cowboys", DEN: "Denver Broncos", DET: "Detroit Lions", GB: "Green Bay Packers",
    HOU: "Houston Texans", IND: "Indianapolis Colts", JAX: "Jacksonville Jaguars", KC: "Kansas City Chiefs",
    LAC: "Los Angeles Chargers", LAR: "Los Angeles Rams", LV: "Las Vegas Raiders", MIA: "Miami Dolphins",
    MIN: "Minnesota Vikings", NE: "New England Patriots", NO: "New Orleans Saints", NYG: "New York Giants",
    NYJ: "New York Jets", PHI: "Philadelphia Eagles", PIT: "Pittsburgh Steelers", SEA: "Seattle Seahawks",
    SF: "San Francisco 49ers", TB: "Tampa Bay Buccaneers", TEN: "Tennessee Titans", WAS: "Washington Commanders"
  };
  const COLORS = {
    ARI: ["#97233F", "#fff"], ATL: ["#A71930", "#fff"], BAL: ["#241773", "#fff"], BUF: ["#00338D", "#fff"],
    CAR: ["#0085CA", "#101820"], CHI: ["#0B162A", "#fff"], CIN: ["#FB4F14", "#000"], CLE: ["#311D00", "#FF3C00"],
    DAL: ["#003594", "#fff"], DEN: ["#FB4F14", "#002244"], DET: ["#0076B6", "#fff"], GB: ["#203731", "#FFB612"],
    HOU: ["#03202F", "#fff"], IND: ["#002C5F", "#fff"], JAX: ["#006778", "#fff"], KC: ["#E31837", "#fff"],
    LAC: ["#0080C6", "#fff"], LAR: ["#003594", "#FFD100"], LV: ["#000000", "#A5ACAF"], MIA: ["#008E97", "#fff"],
    MIN: ["#4F2683", "#FFC62F"], NE: ["#002244", "#fff"], NO: ["#101820", "#D3BC8D"], NYG: ["#0B2265", "#fff"],
    NYJ: ["#125740", "#fff"], PHI: ["#004C54", "#fff"], PIT: ["#101820", "#FFB612"], SEA: ["#002244", "#69BE28"],
    SF: ["#AA0000", "#B3995D"], TB: ["#D50A0A", "#fff"], TEN: ["#0C2340", "#4B92DB"], WAS: ["#5A1414", "#FFB612"]
  };
  // Sleeper's logo where the browser can load it; otherwise a badge in team colors.
  function logo(team) {
    const [bg, fg] = COLORS[team] || ["var(--surface-2)", "var(--fg)"];
    return `<span class="logo" style="background:${bg};color:${fg}" aria-hidden="true">${team}<img src="https://sleepercdn.com/images/team_logos/nfl/${team.toLowerCase()}.png" alt="" onload="this.style.background='var(--surface)'" onerror="this.remove()"></span>`;
  }
  const ALIASES = { TB: "bucs", SF: "niners", NE: "pats", JAX: "jags", WAS: "commies", PHI: "birds", LV: "oakland",
    LAC: "bolts san diego", LAR: "st louis", GB: "pack", NYG: "g-men", KC: "kc", ARI: "cards", IND: "indy" };
  // Matches an abbreviation ("TB"), a location ("tampa bay"), a nickname ("buccaneers") or a short form ("bucs").
  function teamMatches(team, query) {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    const name = ((TEAMS[team] || "") + " " + (ALIASES[team] || "")).toLowerCase();
    return team.toLowerCase().startsWith(q) || name.includes(q) || name.replace(/\s+/g, "").includes(q.replace(/\s+/g, ""));
  }
  const DATA = window.PA_DATA;
  const $ = id => document.getElementById(id);
  const fmt = n => (Math.round(n * 10) / 10).toFixed(1);
  const signed = n => (n >= 0 ? "+" : "−") + fmt(Math.abs(n));
  const diffCls = n => n >= 0.05 ? "up" : n <= -0.05 ? "down" : "";
  const store = {
    get() { try { return JSON.parse(localStorage.getItem("pa-board") || "{}"); } catch { return {}; } },
    set(v) { try { localStorage.setItem("pa-board", JSON.stringify(v)); } catch {} }
  };

  const seasons = Object.keys(DATA.seasons).sort().reverse();
  const saved = store.get();
  const state = {
    season: seasons.includes(saved.season) ? saved.season : seasons[0],
    from: 1, to: 1, mode: saved.mode === "total" ? "total" : "avg",
    search: "", sort: saved.sort || "team", dir: saved.dir || 1, sel: null,
    view: ["board", "week", "team"].includes(saved.view) ? saved.view : "board",
    adj: saved.adj === true,
    mweek: DATA.upcoming ? DATA.upcoming.week : null,
    msort: "team", mdir: 1
  };

  function weeksOf(season) {
    return [...new Set(DATA.seasons[season].map(r => r[0]))].sort((a, b) => a - b);
  }
  function resetWeeks() {
    const w = weeksOf(state.season);
    state.from = w[0]; state.to = w[w.length - 1];
  }

  // Schedule adjustment. Each game's expected points = what that offense's position group
  // usually scores (its other games this season, corrected for the defenses it faced, pulled
  // toward the league average when it has few games). Adjusted points allowed per game =
  // league average + the defense's average of (actual - expected).
  const SHRINK_GAMES = 3, ITERATIONS = 5;
  const expectedCache = {};
  function expectedPoints(season) {
    if (expectedCache[season]) return expectedCache[season];
    const out = new Map();
    for (const pos of POS) {
      const games = DATA.seasons[season].filter(r => r[2] === pos && r[4].length)
        .map(r => ({ wk: r[0], def: r[1], off: r[4][0][1], pts: r[3] }));
      if (!games.length) continue;
      const L = games.reduce((s, g) => s + g.pts, 0) / games.length;
      const shrink = (mean, n) => (n * mean + SHRINK_GAMES * L) / (n + SHRINK_GAMES);
      const group = key => games.reduce((m, g) => ((m[g[key]] ||= []).push(g), m), {});
      const byOff = group("off"), byDef = group("def");
      let defAdj = {};
      for (let i = 0; i < ITERATIONS; i++) {
        // Offense strength: points scored, corrected for how generous each defense faced is.
        const offSum = {};
        for (const [o, gs] of Object.entries(byOff)) offSum[o] = gs.reduce((s, g) => s + g.pts - (defAdj[g.def] || 0), 0);
        for (const g of games) {
          const n = byOff[g.off].length - 1;
          g.exp = n > 0 ? shrink((offSum[g.off] - (g.pts - (defAdj[g.def] || 0))) / n, n) : L;
        }
        defAdj = {};
        for (const [d, gs] of Object.entries(byDef)) defAdj[d] = gs.reduce((s, g) => s + g.pts - g.exp, 0) / gs.length;
      }
      for (const g of games) out.set(`${g.wk}|${g.def}|${pos}`, g.exp);
    }
    return expectedCache[season] = out;
  }

  function compute(season = state.season, from = state.from, to = state.to, mode = state.mode, adj = state.adj) {
    const rows = DATA.seasons[season].filter(r => r[0] >= from && r[0] <= to);
    const expMap = expectedPoints(season);
    const teams = {};
    for (const [wk, def, pos, pts, players] of rows) {
      const t = teams[def] ||= { team: def, games: new Set(), pos: {} };
      t.games.add(wk);
      const c = t.pos[pos] ||= { total: 0, weeks: [] };
      c.total += pts;
      c.weeks.push({ wk, pts, players, exp: expMap.get(`${wk}|${def}|${pos}`) });
    }
    // Offense side: what each team's players at a position usually score, and each player's per-game average.
    const offense = {}, player = {};
    for (const [wk, , pos, pts, players] of rows) {
      if (!players.length) continue;
      const o = offense[players[0][1] + "|" + pos] ||= { total: 0, games: 0 };
      o.total += pts; o.games += 1;
      for (const [, , p, id] of players) {
        const pl = player[id] ||= { total: 0, games: 0 };
        pl.total += p; pl.games += 1;
      }
    }
    const list = Object.values(teams);
    const leagueAvg = {};
    for (const p of POS) {
      for (const t of list) {
        const c = t.pos[p] ||= { total: 0, weeks: [] };
        c.value = mode === "avg" ? c.total / t.games.size : c.total;
      }
      if (adj) {
        const raw = list.reduce((s, t) => s + t.pos[p].total, 0) / list.reduce((s, t) => s + t.games.size, 0);
        for (const t of list) {
          const c = t.pos[p];
          const ou = c.weeks.map(w => w.pts - (w.exp ?? raw));
          const perGame = raw + (ou.length ? ou.reduce((s, x) => s + x, 0) / ou.length : 0);
          c.value = mode === "avg" ? perGame : perGame * t.games.size;
        }
      }
      leagueAvg[p] = list.reduce((s, t) => s + t.pos[p].value, 0) / list.length;
      [...list].sort((a, b) => b.pos[p].value - a.pos[p].value).forEach((t, i) => { t.pos[p].rank = i + 1; });
    }
    for (const t of list) {
      t.pos.ALL = { value: OFF.reduce((s, p) => s + t.pos[p].value, 0), total: OFF.reduce((s, p) => s + t.pos[p].total, 0), weeks: [] };
    }
    leagueAvg.ALL = OFF.reduce((s, p) => s + leagueAvg[p], 0);
    [...list].sort((a, b) => b.pos.ALL.value - a.pos.ALL.value).forEach((t, i) => { t.pos.ALL.rank = i + 1; });
    const byTeam = Object.fromEntries(list.map(t => [t.team, t]));
    return { list, byTeam, leagueAvg, n: list.length, offense, player, season, from, to };
  }

  function cellColor(v, avg, spread = 0.4) {
    if (!avg) return "transparent";
    const d = Math.max(-1, Math.min(1, (v - avg) / avg / spread));
    const pct = Math.round(Math.abs(d) * 55);
    return `color-mix(in srgb, var(${d >= 0 ? "--good" : "--bad"}) ${pct}%, var(--surface))`;
  }
  function tier(rank, n) {
    if (rank <= Math.round(n / 4)) return ["good", "Easy matchup"];
    if (rank > n - Math.round(n / 4)) return ["bad", "Tough matchup"];
    return ["mid", "Neutral"];
  }

  function renderControls() {
    $("season").innerHTML = seasons.map(s => `<option ${s === state.season ? "selected" : ""}>${s}</option>`).join("");
    const w = weeksOf(state.season);
    const opts = sel => w.map(x => `<option value="${x}" ${x === sel ? "selected" : ""}>Week ${x}</option>`).join("");
    $("from").innerHTML = opts(state.from);
    $("to").innerHTML = opts(state.to);
    const span = w.filter(x => x >= state.from && x <= state.to).length;
    const last = w[w.length - 1];
    document.querySelectorAll("#quick button").forEach(b => {
      const n = +b.dataset.n;
      const on = state.to === last && (n === 0 ? state.from === w[0] : span === n);
      b.setAttribute("aria-pressed", on);
    });
    document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
    const up = DATA.upcoming;
    $("mweek-field").hidden = state.view === "board" || !up;
    if (up) $("mweek").innerHTML = Object.keys(up.weeks).map(w => `<option value="${w}" ${+w === state.mweek ? "selected" : ""}>Week ${w}${+w === up.week ? " (next)" : ""}</option>`).join("");
    document.querySelectorAll("#adj button").forEach(b => b.setAttribute("aria-pressed", b.dataset.adj === (state.adj ? "1" : "0")));
  }

  function renderBoard(model) {
    const q = state.search.trim();
    let list = model.list.filter(t => teamMatches(t.team, q));
    list.sort((a, b) => state.sort === "team"
      ? state.dir * a.team.localeCompare(b.team)
      : state.dir * (b.pos[state.sort].value - a.pos[state.sort].value));
    const arrow = k => state.sort === k ? `<span class="arrow">${state.dir === 1 ? "▼" : "▲"}</span>` : "";
    let html = `<thead><tr><th scope="col"><button type="button" data-sort="team">TEAM${arrow("team")}</button></th>` +
      COLS.map(p => `<th scope="col" class="${p === "ALL" ? "all" : ""}"><button type="button" data-sort="${p}">${p}${arrow(p)}<span class="avg">avg ${fmt(model.leagueAvg[p])}</span></button></th>`).join("") +
      `</tr></thead><tbody>`;
    if (!list.length) html += `<tr><td colspan="8" class="empty">No team matches "${q}". Try an abbreviation, city or nickname, like DAL, Dallas or Cowboys.</td></tr>`;
    for (const t of list) {
      html += `<tr><th scope="row" title="${TEAMS[t.team] || ""}"><span class="tm">${t.team}${logo(t.team)}</span></th>` + COLS.map(p => {
        const c = t.pos[p];
        const sel = state.sel && state.sel.team === t.team && state.sel.pos === p;
        return `<td class="cell" tabindex="0" role="button" aria-selected="${!!sel}" data-team="${t.team}" data-pos="${p}"
          aria-label="${t.team} allowed ${fmt(c.value)} to ${p}, ${signed(c.value - model.leagueAvg[p])} vs league average, rank ${c.rank}"
          style="background:${cellColor(c.value, model.leagueAvg[p], p === "ALL" ? 0.12 : 0.4)}"><span class="v">${signed(c.value - model.leagueAvg[p])}</span><span class="r">${fmt(c.value)}</span></td>`;
      }).join("") + `</tr>`;
    }
    $("board").innerHTML = html + "</tbody>";
  }

  function renderDetail(model) {
    const el = $("detail");
    const t = state.sel && model.list.find(x => x.team === state.sel.team);
    if (!t) {
      el.innerHTML = `<p class="hint">Tap a number in the board to see which players scored those points, week by week.</p>`;
      return;
    }
    const p = state.sel.pos, c = t.pos[p];
    const [cls, label] = tier(c.rank, model.n);
    const diff = c.value - model.leagueAvg[p];
    // Expected (adjusted) or the offense's average (raw) for one position-week.
    const baseOf = (w, pos) => {
      const team = w.players[0] && w.players[0][1], o = team && model.offense[team + "|" + pos];
      if (state.adj && w.exp != null) return w.exp;
      return o ? o.total / o.games : w.pts;
    };
    let weeks;
    if (p === "ALL") {
      const byWk = {};
      for (const pos of OFF) for (const w of t.pos[pos].weeks) {
        const a = byWk[w.wk] ||= { wk: w.wk, pts: 0, base: 0, players: [], parts: [] };
        a.pts += w.pts; a.base += baseOf(w, pos);
        if (!a.players.length) a.players = w.players;
        a.parts.push({ pos, pts: w.pts, base: baseOf(w, pos) });
      }
      weeks = Object.values(byWk).sort((a, b) => b.wk - a.wk);
    } else {
      weeks = [...c.weeks].sort((a, b) => b.wk - a.wk);
    }
    const oppLine = w => {
      const team = w.players[0] && w.players[0][1];
      if (!team) return `<span class="opp">—</span>`;
      const adj = state.adj && (p === "ALL" || w.exp != null);
      const base = p === "ALL" ? w.base : baseOf(w, p);
      const d = w.pts - base;
      return `<span class="opp" title="${TEAMS[team] || ""}">${team} <span class="d ${diffCls(d)}">${signed(d)}</span></span>
        <span class="note">${fmt(base)} ${adj ? "expected" : "avg"}</span>`;
    };
    el.innerHTML = `
      <div><div class="eyebrow">${state.season} · weeks ${state.from}–${state.to}</div>
      <h2>${t.team} vs ${p === "ALL" ? "all offense" : p} <span class="pill ${cls}">${label}</span></h2></div>
      <div class="stats">
        <div class="stat"><b>${fmt(c.value)}</b><span>${state.adj ? "Adjusted " : ""}${state.mode === "avg" ? "per game" : "total"}</span></div>
        <div class="stat"><b>#${c.rank}</b><span>of ${model.n}</span></div>
        <div class="stat"><b>${diff >= 0 ? "+" : "−"}${fmt(Math.abs(diff))}</b><span>vs league avg</span></div>
        <div class="stat"><b>${t.games.size}</b><span>Games</span></div>
      </div>
      <p class="hint">${state.adj
        ? `Schedule-adjusted: next to each opponent is how far the game beat or missed what that offense's ${p}s were expected to score, based on their other ${state.season} games and the defenses they faced. Player numbers compare with each player's own per-game average.`
        : `Green and red numbers compare each game with that offense's or player's own per-game average for ${state.season}, weeks ${state.from}–${state.to}.`}</p>
      <div class="weeks">${weeks.map(w => `
        <div class="wk"><div class="side"><span class="lbl">Week ${w.wk} ${w.players[0] ? logo(w.players[0][1]) : ""}</span>
          ${oppLine(w)}</div>
          <span class="tot">${fmt(w.pts)}</span>
          <ul>${p === "ALL" ? w.parts.map(x => `<li>${x.pos} <b>${fmt(x.pts)}</b> <span class="d ${diffCls(x.pts - x.base)}">${signed(x.pts - x.base)}</span></li>`).join("") : w.players.map(([n, , pts, id]) => {
            const pl = model.player[id], d = pts - pl.total / pl.games;
            return `<li class="${pts ? "" : "zero"}">${n} <b>${fmt(pts)}</b> <span class="d ${diffCls(d)}" title="vs per-game avg ${fmt(pl.total / pl.games)} avg">${signed(d)}</span></li>`;
          }).join("")}</ul>
        </div>`).join("")}</div>`;
  }

  // Upcoming matchups always use the current season: the selected week range when it is the
  // current season, otherwise the whole current season so far. Always per game.
  function matchupModel() {
    const up = DATA.upcoming;
    if (!up || !DATA.seasons[up.season]) return null;
    const w = weeksOf(up.season);
    const same = state.season === up.season;
    const model = compute(up.season, same ? state.from : w[0], same ? state.to : w[w.length - 1], "avg", state.adj);
    model.opp = {};
    model.week = state.mweek;
    for (const [away, home, date] of up.weeks[state.mweek] || []) {
      model.opp[away] = { team: home, at: "@", date };
      model.opp[home] = { team: away, at: "vs", date };
    }
    return model;
  }

  function rangeText(m) {
    return `${m.season} weeks ${m.from}–${m.to}`;
  }

  function renderWeek() {
    const m = matchupModel(), el = $("week");
    if (!m) { el.innerHTML = `<tbody><tr><td class="empty">No upcoming games on the schedule.</td></tr></tbody>`; $("byes").textContent = ""; return; }
    const q = state.search.trim();
    const diffOf = (team, p) => { const c = m.byTeam[m.opp[team].team]?.pos[p]; return c ? c.value - m.leagueAvg[p] : -Infinity; };
    const order = Object.keys(m.opp).filter(t => teamMatches(t, q) || teamMatches(m.opp[t].team, q))
      .sort((a, b) => state.msort === "team" ? state.mdir * a.localeCompare(b) : state.mdir * (diffOf(b, state.msort) - diffOf(a, state.msort)));
    const arrow = k => state.msort === k ? `<span class="arrow">${state.mdir === 1 ? "▼" : "▲"}</span>` : "";
    let html = `<thead><tr><th scope="col"><button type="button" data-msort="team">OFFENSE${arrow("team")}</button></th>` +
      POS.map(p => `<th scope="col"><button type="button" data-msort="${p}">${p}${arrow(p)}</button></th>`).join("") + `</tr></thead><tbody>`;
    if (!order.length) html += `<tr><td colspan="7" class="empty">No team matches "${q}". Try an abbreviation, city or nickname.</td></tr>`;
    for (const team of order) {
      const o = m.opp[team], d = m.byTeam[o.team];
      html += `<tr><th scope="row" title="${TEAMS[team] || ""}"><span class="tm">${team}${logo(team)}</span><span class="opp-of">${o.at} ${o.team}</span></th>` + POS.map(p => {
        const c = d && d.pos[p];
        if (!c) return `<td class="cell">—</td>`;
        const diff = c.value - m.leagueAvg[p];
        return `<td class="cell" tabindex="0" role="button" data-team="${o.team}" data-pos="${p}"
          aria-label="${team} ${p} faces ${o.team}, which allows ${signed(diff)} vs average, rank ${c.rank}"
          style="background:${cellColor(c.value, m.leagueAvg[p])}"><span class="v">${signed(diff)}</span><span class="r">#${c.rank}</span></td>`;
      }).join("") + `</tr>`;
    }
    el.innerHTML = html + "</tbody>";
    el.classList.add("matchup");
    const playing = new Set(Object.keys(m.opp));
    const byes = m.list.map(t => t.team).filter(t => !playing.has(t)).sort();
    $("byes").textContent = byes.length ? `On bye in week ${m.week}: ${byes.join(", ")}.` : "";
  }

  function renderTeam() {
    const el = $("team"), r = DATA.roster, m = matchupModel();
    if (!r) { el.innerHTML = `<p class="hint">Roster not found. Check sleeper_username in config.json.</p>`; return; }
    const row = pl => {
      const o = m && m.opp[pl.team];
      const own = m && m.player[pl.id];
      const ownTxt = own ? `${fmt(own.total / own.games)} pts/game` : "No games yet";
      if (!o) {
        return `<div class="pl ${pl.starter ? "" : "bench"}"><span class="pos">${pl.pos}</span>
          <span class="who"><b>${pl.name}</b><small>${pl.team || "FA"} · ${ownTxt}</small></span>
          <span class="rate"><span class="pill mid">${pl.team ? "Bye" : "No game"}</span></span></div>`;
      }
      const c = m.byTeam[o.team].pos[pl.pos], diff = c.value - m.leagueAvg[pl.pos];
      const [cls, label] = tier(c.rank, m.n);
      return `<div class="pl tap ${pl.starter ? "" : "bench"}" tabindex="0" role="button" data-team="${o.team}" data-pos="${pl.pos}">
        <span class="pos">${pl.pos}</span>
        <span class="who"><b>${pl.name}</b><small>${pl.team} ${o.at} ${o.team} · ${ownTxt}</small></span>
        <span class="rate"><span class="pill ${cls}">${label}</span>
          <b class="d ${diffCls(diff)}">${signed(diff)}</b><small>${o.team} allows ${fmt(c.value)} · #${c.rank}</small></span></div>`;
    };
    const starters = r.players.filter(p => p.starter), bench = r.players.filter(p => !p.starter);
    el.innerHTML = `<div><div class="eyebrow">Week ${m ? m.week : "—"} matchups</div><h2>${r.team_name}</h2></div>
      ${m ? `<p class="hint">Big number = points the opponent allows to that position above or below the league average, per game (${rangeText(m)}). Tap a player to see that defense's games.</p>` : ""}
      <div class="group-label">Starters</div>${starters.map(row).join("")}
      <div class="group-label">Bench</div>${bench.map(row).join("")}`;
  }

  function render() {
    const model = compute();
    renderControls();
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.view === state.view));
    for (const v of ["board", "week", "team"]) $("view-" + v).hidden = v !== state.view;
    const m = state.view === "board" ? null : matchupModel();
    $("legend-note").textContent = state.view === "board"
      ? `Big number = ${state.adj ? "schedule-adjusted " : ""}points above or below the league average for that position. Small number = ${state.adj ? "adjusted " : ""}points allowed ${state.mode === "avg" ? "per game" : "in total"}. ALL = QB + RB + WR + TE + K (DEF left out).`
      : m ? `Week ${m.week}: each cell is the opponent's points allowed vs league average, per game (${rangeText(m)}). Small number = opponent's rank.` : "";
    if (state.view === "board") { renderBoard(model); renderDetail(model); }
    if (state.view === "week") renderWeek();
    if (state.view === "team") renderTeam();
    store.set({ season: state.season, mode: state.mode, sort: state.sort, dir: state.dir, view: state.view, adj: state.adj });
  }

  function openDetail(team, pos) {
    const up = DATA.upcoming;
    if (up && state.view !== "board" && state.season !== up.season) { state.season = up.season; resetWeeks(); }
    state.view = "board";
    state.sel = { team, pos };
    render();
    $("detail").scrollIntoView({ block: "start" });
  }

  $("season").addEventListener("change", e => { state.season = e.target.value; resetWeeks(); render(); });
  $("from").addEventListener("change", e => { state.from = +e.target.value; if (state.to < state.from) state.to = state.from; render(); });
  $("to").addEventListener("change", e => { state.to = +e.target.value; if (state.from > state.to) state.from = state.to; render(); });
  $("quick").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const w = weeksOf(state.season), n = +b.dataset.n;
    state.to = w[w.length - 1];
    state.from = n ? w[Math.max(0, w.length - n)] : w[0];
    render();
  });
  $("mode").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.mode = b.dataset.mode; render();
  });
  $("search").addEventListener("input", e => { state.search = e.target.value; render(); });
  $("mweek").addEventListener("change", e => { state.mweek = +e.target.value; render(); });
  $("week").addEventListener("click", e => {
    const s = e.target.closest("[data-msort]"); if (!s) return;
    const k = s.dataset.msort;
    state.mdir = state.msort === k ? -state.mdir : 1;
    state.msort = k; render();
  });
  $("adj").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.adj = b.dataset.adj === "1"; render();
  });
  $("tabs").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.view = b.dataset.view; render();
  });
  for (const id of ["week", "team"]) {
    $(id).addEventListener("click", e => {
      const c = e.target.closest("[data-team][data-pos]");
      if (c) openDetail(c.dataset.team, c.dataset.pos);
    });
    $(id).addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-team][data-pos]")) { e.preventDefault(); e.target.click(); }
    });
  }
  $("board").addEventListener("click", e => {
    const s = e.target.closest("[data-sort]");
    if (s) {
      const k = s.dataset.sort;
      state.dir = state.sort === k ? -state.dir : 1;
      state.sort = k; render(); return;
    }
    const c = e.target.closest("td.cell");
    if (c) {
      state.sel = { team: c.dataset.team, pos: c.dataset.pos };
      render();
      $("detail").scrollIntoView({ block: "start" });
    }
  });
  $("board").addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("td.cell")) { e.preventDefault(); e.target.click(); }
  });

  resetWeeks();
  $("foot").textContent = `Scored with your current league settings. Data updated ${DATA.generated.replace("T", " ")} UTC.`;
  render();
})();
</script>
